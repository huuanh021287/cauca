<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Câu Cá Online</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- VT323 (pixel) cho tiêu đề/số, Be Vietnam Pro cho chữ nhỏ; cả hai có bộ ký tự tiếng Việt.
       Không tải được (mất mạng) thì canvas dùng monospace / sans-serif. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;800&family=VT323&subset=vietnamese&display=swap">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }
    #stage {
      position: relative;
      aspect-ratio: 9 / 16;
      width: min(100vw, calc(100vh * 9 / 16));
    }
    #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #pixel { image-rendering: pixelated; image-rendering: crisp-edges; }
    /* Hiệu ứng Lottie (render/effects.js): đặt bằng % của khung, không nhận chuột */
    #fx { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
    .fx-item { position: absolute; transform: translate(-50%, -50%); }
    .fx-item svg { width: 100%; height: 100%; overflow: visible; }
    /* Lớp chữ HUD SVG (render/textlayer.js): đặt trên canvas HUD, không nhận chuột */
    #hudtext { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
    /* Lớp nhân vật SVG (render/actors.js): hoạt hình CSS, tọa độ 270×480 như canvas pixel */
    #actors { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
    #actors .breathe { animation: breathe 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    #actors .blink { animation: blink 4.6s infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    #actors .bob-float { animation: floatY 1.8s ease-in-out infinite; }
    #actors .exclaim { animation: bounce 0.42s ease-in-out infinite alternate; }
    #actors .fish { animation: sway 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    #actors .miss { animation: wobble 1.2s ease-in-out infinite; }
    #actors .aura.legendary { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.035); } }
    @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 95.5% { transform: scaleY(0.1); } }
    @keyframes floatY { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-0.8px); } }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-1.5px); } }
    @keyframes sway { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
    @keyframes wobble { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1px); } }
    @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.85; } }
    @media (prefers-reduced-motion: reduce) { #actors * { animation: none !important; } }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="pixel" width="270" height="480"></canvas>
    <svg id="actors" viewBox="0 0 270 480" aria-hidden="true"></svg>
    <div id="fx" aria-hidden="true"></div>
    <canvas id="hud" width="1080" height="1920"></canvas>
    <svg id="hudtext" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
  </div>
  <script src="/game/vendor/lottie_svg.min.js"></script>
  <script type="module" src="/game/main.js"></script>
</body>
</html>
