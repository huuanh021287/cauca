<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Câu Cá Online</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- VT323 (pixel) cho tiêu đề/số, Be Vietnam Pro cho chữ nhỏ; cả hai có bộ ký tự tiếng Việt.
       Không tải được (mất mạng) thì canvas dùng monospace / sans-serif. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;800&family=VT323&subset=vietnamese&display=swap">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }
    #stage {
      position: relative;
      aspect-ratio: 9 / 16;
      width: min(100vw, calc(100vh * 9 / 16));
    }
    #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #pixel { image-rendering: pixelated; image-rendering: crisp-edges; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="pixel" width="270" height="480"></canvas>
    <canvas id="hud" width="1080" height="1920"></canvas>
  </div>
  <script type="module" src="/game/main.js"></script>
</body>
</html>
